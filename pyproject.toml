[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-workbench"
version = "0.0.1"
description = "A workspace for product operations and customer service."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[project.scripts]
commerce-workbench = "commerce_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commerce_workbench = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
